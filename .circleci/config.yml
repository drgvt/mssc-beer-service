version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout

      # Восстанавливаем кэш Maven, чтобы не скачивать зависимости каждый раз
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-

      # Скачиваем зависимости (если их нет в кэше)
      - run:
          name: Download Dependencies
          command: mvn dependency:go-offline

      # Сохраняем кэш
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}

      # Сборка и тесты
      - run:
          name: Build and Test
          command: mvn clean package

workflows:
  version: 2
  build-and-test-workflow:
    jobs:
      - build-and-test